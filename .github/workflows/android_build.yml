name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BlackBox-V2-Engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            BlackBox-V2-Engine/*.gradle
            BlackBox-V2-Engine/**/*.gradle
            BlackBox-V2-Engine/**/*.gradle.kts
            BlackBox-V2-Engine/gradle/libs.versions.toml
            BlackBox-V2-Engine/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build AAR and APKs
        run: ./gradlew --no-daemon :Bcore:assembleRelease :app:assembleRelease :app:assembleDebug

      - name: Upload Bcore release AAR
        uses: actions/upload-artifact@v4
        with:
          name: Bcore-release-aar
          path: BlackBox-V2-Engine/Bcore/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload app release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: BlackBox-V2-Engine/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload app debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: BlackBox-V2-Engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
